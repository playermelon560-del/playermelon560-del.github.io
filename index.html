<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cloud Terminal</title>

<style>

body{
    background:#0c0c0c;
    color:#00ff41;
    font-family:Courier New, monospace;
    margin:0;
    padding:10px;
}

#terminal{
    padding-bottom:100px;
}

.prompt{
    color:#ff00ff;
}

.location{
    color:#00aaff;
}

.output,.line{
    margin-bottom:8px;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.input-line{
    display:flex;
    align-items:center;
}

#cmd{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:#00ff41;
    font-size:16px;
    font-family:inherit;
}

button{
    background:#111;
    border:1px solid #00ff41;
    color:#00ff41;
    padding:8px;
    margin-bottom:10px;
}

a{
    color:#00aaff;
}

</style>
</head>

<body>

<button onclick="googleLogin()">Login With Google</button>

<div id="userInfo"></div>

<div id="terminal">

<div class="output">
Cloud OS Terminal Started
Database Connected
Type help
</div>

<div class="input-line">
<span class="prompt">user@cloud</span>:<span class="location">~/</span>$&nbsp;

<input
id="cmd"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
autofocus
>
</div>

</div>

<div style="margin-top:20px;">
<a href="terms.html">Terms & Conditions</a><br>
<a href="privacy.html">Privacy Policy</a>
</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/*
====================================
YOUR FIREBASE CONFIG
====================================
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.appspot.com",

    messagingSenderId: "XXXX",

    appId: "XXXX"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/*
====================================
GOOGLE LOGIN
====================================
*/

window.googleLogin = async function(){

    const provider = new GoogleAuthProvider();

    try{

        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        document.getElementById("userInfo").innerHTML =
        `
        Logged in:<br>
        ${user.displayName}<br>
        ${user.email}
        `;

        /*
        SAVE USER DATA
        */

        await setDoc(doc(db,"users",user.uid),{

            name:user.displayName,

            email:user.email,

            lastLogin:new Date().toString(),

            browser:navigator.userAgent,

            platform:navigator.platform

        });

        addOutput("Google login successful.");

    }
    catch(err){

        addOutput("Login failed.");
        console.error(err);

    }
}

/*
====================================
TERMINAL
====================================
*/

const input = document.getElementById("cmd");

function addOutput(text){

    const div = document.createElement("div");

    div.className = "output";

    div.innerHTML = text;

    terminal.insertBefore(div, terminal.lastElementChild);

    window.scrollTo(0,document.body.scrollHeight);
}

input.addEventListener("keydown",async function(e){

    if(e.key === "Enter"){

        const command = input.value;

        addOutput(
        '<span class="prompt">user@cloud</span>:<span class="location">~/</span>$ '
        + command
        );

        if(command === "help"){

            addOutput(`
Commands:<br>
help<br>
date<br>
clear
            `);

        }

        else if(command === "date"){

            addOutput(new Date());

        }

        else if(command === "clear"){

            location.reload();

        }

        else{

            addOutput("Command not found.");

        }

        input.value = "";
    }
});

document.body.addEventListener("click",()=>{
    input.focus();
});

</script>

</body>
</html>
